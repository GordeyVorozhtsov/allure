# Стенд 8090: полноценный бэкенд Allure<3 (FastAPI) + SPA-фронт web/.
# Конфигурация и секреты — в .env (см. .env.example). Здесь остаются только
# инварианты образа/рантайма (пути к CLI, флаги запуска Keycloak).

name: pyallure

services:
  allure-hub:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Инварианты образа — пути к CLI генераторов внутри контейнера.
      ALLURE_BIN: /usr/local/bin/allure
      ALLURE3_BIN: /usr/local/bin/allure3
    ports:
      - "8090:8090"
    volumes:
      - allure3-data:/data
    depends_on:
      - keycloak
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    env_file: .env
    environment:
      # Инварианты конфигурации Keycloak (работают с любыми секретами из .env).
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      # HTTPS для админ-консоли (self-signed, см. deploy/keycloak/tls/).
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/tls/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/tls/tls.key
    ports:
      - "8088:8080"
      - "8443:8443"
    volumes:
      - ./deploy/keycloak/allure-realm.json:/opt/keycloak/data/import/allure-realm.json:ro
      - ./deploy/keycloak/tls:/opt/keycloak/tls:ro
    restart: unless-stopped

volumes:
  allure3-data:
    name: pyallure_allure3-data